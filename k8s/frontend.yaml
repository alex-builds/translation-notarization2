apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: translation-notarization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: translation-notarization
spec:
  selector:
    app: frontend
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
