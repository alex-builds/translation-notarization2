apiVersion: v1
kind: Service
metadata:
  name: notarization
  namespace: translation-notarization
spec:
  selector:
    app: notarization
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notarization
  namespace: translation-notarization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notarization
  template:
    metadata:
      labels:
        app: notarization
    spec:
      containers:
        - name: notarization
          image: notarization-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
