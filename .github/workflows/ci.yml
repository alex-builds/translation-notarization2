name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, workers, notarization, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f ".eslintrc*" ] || grep -q '"eslint"' package.json 2>/dev/null; then
            npx eslint src/ --ext .js,.ts --max-warnings 0
          elif npm run lint --if-present 2>/dev/null; then
            echo "Ran lint script"
          else
            echo "No linter configured for ${{ matrix.service }}, skipping"
          fi

  # ─────────────────────────────────────────────
  # Job 2: Test (Playwright E2E)
  # ─────────────────────────────────────────────
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/translation-notarization-test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      STRIPE_SECRET_KEY: sk_test_placeholder
      RESEND_API_KEY: re_placeholder
      NOTARY_EMAIL: notary@test.com
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install notarization dependencies
        working-directory: notarization
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: node src/index.js &
        env:
          PORT: 3001

      - name: Start notarization service
        working-directory: notarization
        run: node src/index.js &
        env:
          PORT: 3002

      - name: Start frontend
        working-directory: frontend
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/health http://localhost:3002/health http://localhost:3000 --timeout 30000

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Build Docker images
  # ─────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - service: backend
            image: backend
            port: 3001
          - service: workers
            image: workers
            port: ''
          - service: notarization
            image: notarization-service
            port: 3002
          - service: frontend
            image: frontend
            port: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::No Dockerfile found for ${{ matrix.service }}"
          fi

      - name: Build Docker image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
